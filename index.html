
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPv4 Binary Converter</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>IPv4 Binary Converter</h1>

        <p class="description">
            Convert an IPv4 decimal address into its
            corresponding 8-bit binary octets.
        </p>

        <label for="ipAddress">IPv4 Address</label>

        <input
            type="text"
            id="ipAddress"
            placeholder="e.g. 192.168.1.0"
            maxlength="15"
        >

        <button id="convertBtn">Convert to Binary</button>

        <div class="result-box">
            <h2>Binary Result</h2>

            <p id="result" class="binary-result">
                00000000.00000000.00000000.00000000
            </p>

            <button id="copyBtn" class="copy-btn">
                Copy Binary
            </button>
        </div>

        <p id="error" class="error"></p>

        <p class="footer">
            IPv4 Address Converter | Decimal to Binary
        </p>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
